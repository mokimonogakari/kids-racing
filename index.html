<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#6fcbff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ぶーぶーレース">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="ちいさなこどものための、まけないレースゲーム。ゆびでさわるだけで あそべます。">
  <title>ぶーぶーレース</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">{"imports":{"three":"./js/vendor/three.module.js","three/addons/":"./js/vendor/three-addons/"}}</script>
    <script type="module" src="js/main.js"></script>
</head>
<body>
  <canvas id="gl" aria-hidden="true"></canvas>
  <canvas id="game" aria-hidden="true"></canvas>
  <div id="safe" aria-hidden="true"></div>

  <main id="app">
    <!-- タイトル -->
    <section id="scr-title" class="screen menu active" aria-label="タイトル">
      <div class="sky-deco" aria-hidden="true"><i></i><i></i><i></i></div>
      <h1 class="logo" aria-label="ぶーぶーレース グランプリ"><span class="l1">ぶーぶー</span><span class="l2">レース</span><span class="l3">グランプリ</span></h1>
      <canvas class="title-car" width="320" height="320" aria-hidden="true"></canvas>
      <div class="title-buttons">
        <button id="btn-book" class="round-btn book" type="button" aria-label="シールブック">
          <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="10" y="8" width="44" height="48" rx="8" fill="#ff8fb1" stroke="#3d2c3e" stroke-width="4"/><rect x="10" y="8" width="10" height="48" rx="4" fill="#ff5a8a" stroke="#3d2c3e" stroke-width="4"/><circle cx="37" cy="26" r="8" fill="#ffd23f" stroke="#3d2c3e" stroke-width="3"/><path d="M30 44 l7-5 7 5" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg>
        </button>
        <button id="btn-start" class="big-btn play" type="button" aria-label="あそぶ">
          <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M22 14 L50 32 L22 50 Z" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round"/></svg>
        </button>
        <button id="btn-gp" class="big-btn gp" type="button" aria-label="グランプリ（4つのコースで しょうぶ）">
          <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M18 10h28v14a14 14 0 0 1-28 0z" fill="#ffd23f" stroke="#fff" stroke-width="4" stroke-linejoin="round"/><path d="M18 14H9v4a9 9 0 0 0 9 9M46 14h9v4a9 9 0 0 1-9 9" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><path d="M32 38v8" stroke="#fff" stroke-width="6" stroke-linecap="round"/><rect x="20" y="46" width="24" height="8" rx="3" fill="#ffd23f" stroke="#fff" stroke-width="3"/><path d="M32 16l2.4 5 5.4.6-4 3.7 1.1 5.4L32 28l-4.9 2.7 1.1-5.4-4-3.7 5.4-.6z" fill="#fff"/></svg>
        </button>
        <button id="btn-circuit" class="big-btn circuit" type="button" aria-label="サーキット（3しゅう しょうぶ）">
          <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M14 8v50" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="M16 10h34l-6 10 6 10H16z" fill="#fff"/><path d="M16 10h8.5v6.7H16zM33 10h8.5v6.7H33zM24.5 16.7H33v6.6h-8.5zM41.5 16.7H50l-4 6.6h-4.5zM16 23.3h8.5V30H16zM33 23.3h8.5V30H33z" fill="#3d2c3e"/></svg>
        </button>
      </div>
    </section>

    <!-- ガレージ（サーキット） -->
    <section id="scr-garage" class="screen menu garage" aria-label="ガレージ" hidden>
      <header class="bar">
        <button class="round-btn back" type="button" data-go="title" aria-label="もどる">
          <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M38 14 L20 32 L38 50" fill="none" stroke="#3d2c3e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="round-btn speak" type="button" data-say="どの くるまに する？" aria-label="もういちど きく">
          <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M12 26h10l12-10v32L22 38H12z" fill="#ffd23f" stroke="#3d2c3e" stroke-width="4" stroke-linejoin="round"/><path d="M42 24c4 4 4 12 0 16M48 18c8 8 8 20 0 28" fill="none" stroke="#3d2c3e" stroke-width="4" stroke-linecap="round"/></svg>
        </button>
      </header>
      <div class="garage-stage">
        <canvas id="garage-gl" aria-hidden="true" hidden></canvas>
        <canvas id="garage-car" width="640" height="400" aria-hidden="true"></canvas>
        <div class="turntable" aria-hidden="true"></div>
      </div>
      <div class="garage-models" role="list" aria-label="くるま"></div>
      <div class="garage-colors" role="list" aria-label="いろ"></div>
      <div class="garage-stats" aria-hidden="true"></div>
      <button id="btn-garage-go" class="big-btn play" type="button" aria-label="これに きめた">
        <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M22 14 L50 32 L22 50 Z" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round"/></svg>
      </button>
    </section>

    <!-- サーキット えらび -->
    <section id="scr-circuit" class="screen menu" aria-label="サーキットをえらぶ" hidden>
      <header class="bar">
        <button class="round-btn back" type="button" data-go="garage" aria-label="もどる">
          <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M38 14 L20 32 L38 50" fill="none" stroke="#3d2c3e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="round-btn speak" type="button" data-say="どの サーキットを はしる？" aria-label="もういちど きく">
          <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M12 26h10l12-10v32L22 38H12z" fill="#ffd23f" stroke="#3d2c3e" stroke-width="4" stroke-linejoin="round"/><path d="M42 24c4 4 4 12 0 16M48 18c8 8 8 20 0 28" fill="none" stroke="#3d2c3e" stroke-width="4" stroke-linecap="round"/></svg>
        </button>
      </header>
      <div class="grid circuits" role="list"></div>
    </section>

    <!-- のりもの えらび -->
    <section id="scr-vehicle" class="screen menu" aria-label="のりものをえらぶ" hidden>
      <header class="bar">
        <button class="round-btn back" type="button" data-go="title" aria-label="もどる">
          <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M38 14 L20 32 L38 50" fill="none" stroke="#3d2c3e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="round-btn speak" type="button" data-say="どれに のる？" aria-label="もういちど きく">
          <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M12 26h10l12-10v32L22 38H12z" fill="#ffd23f" stroke="#3d2c3e" stroke-width="4" stroke-linejoin="round"/><path d="M42 24c4 4 4 12 0 16M48 18c8 8 8 20 0 28" fill="none" stroke="#3d2c3e" stroke-width="4" stroke-linecap="round"/></svg>
        </button>
      </header>
      <div class="grid vehicles" role="list"></div>
    </section>

    <!-- コース えらび -->
    <section id="scr-course" class="screen menu" aria-label="コースをえらぶ" hidden>
      <header class="bar">
        <button class="round-btn back" type="button" data-go="vehicle" aria-label="もどる">
          <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M38 14 L20 32 L38 50" fill="none" stroke="#3d2c3e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="round-btn speak" type="button" data-say="どこを はしる？" aria-label="もういちど きく">
          <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M12 26h10l12-10v32L22 38H12z" fill="#ffd23f" stroke="#3d2c3e" stroke-width="4" stroke-linejoin="round"/><path d="M42 24c4 4 4 12 0 16M48 18c8 8 8 20 0 28" fill="none" stroke="#3d2c3e" stroke-width="4" stroke-linecap="round"/></svg>
        </button>
        <canvas class="chosen-vehicle" width="160" height="160" aria-hidden="true"></canvas>
      </header>
      <div class="grid courses" role="list"></div>
    </section>

    <!-- レース中 -->
    <section id="scr-race" class="screen race" aria-label="レース" hidden>
      <button id="btn-pause" class="race-pause" aria-label="ひとやすみ">Ⅱ</button>
      <div class="star-goal" aria-live="polite">⭐ <span id="star-count">0 / 5</span></div>
      <button class="steer-pad steer-left" data-steer="-1" aria-label="ひだりへ">◀</button>
      <button class="steer-pad steer-right" data-steer="1" aria-label="みぎへ">▶</button>
      <button id="btn-honk" class="round-btn honk" type="button" aria-label="クラクション">
        <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M10 26h8l22-12v36L18 38h-8z" fill="#ffd23f" stroke="#3d2c3e" stroke-width="4" stroke-linejoin="round"/><circle cx="48" cy="20" r="3.5" fill="#fff"/><path d="M46 32h10M45 22l7-5M45 42l7 5" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg>
      </button>
      <button id="btn-boost" class="round-btn boost" type="button" aria-label="ブースト（ほしが5こ たまったら おせる）">
        <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M36 6 L14 36 h16 l-4 22 L50 26 H34 z" fill="#fff" stroke="#3d2c3e" stroke-width="4" stroke-linejoin="round"/></svg>
      </button>
      <button id="btn-cam" class="round-btn cam" type="button" aria-label="カメラを かえる" hidden>
        <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="8" y="18" width="38" height="28" rx="6" fill="#fff" stroke="#3d2c3e" stroke-width="4"/><path d="M46 28l12-7v22l-12-7z" fill="#fff" stroke="#3d2c3e" stroke-width="4" stroke-linejoin="round"/><circle cx="20" cy="32" r="5" fill="#ff5a5a"/></svg>
      </button>
      <div id="grid-intro" class="grid-intro" aria-label="スタートグリッド" hidden></div>
    </section>

    <!-- ゴール -->
    <section id="scr-goal" class="screen goal" aria-label="ゴール" hidden>
      <div class="goal-card">
        <div class="goal-hero">
          <div class="medal" id="medal" aria-label="メダル"><canvas id="medal-canvas" width="240" height="240" aria-hidden="true"></canvas></div>
          <canvas class="goal-car" width="320" height="320" aria-hidden="true"></canvas>
        </div>
        <!-- JS が .step（.p2 .p1 .p3 の順、プレイヤーには .you）を3つ入れる -->
        <div id="podium" class="podium" aria-label="ひょうしょうだい"></div>
        <div id="your-place" class="your-place" hidden><canvas width="120" height="120" aria-hidden="true"></canvas><b></b></div>
        <div id="results" class="results" aria-label="リザルト"></div>
        <div id="laps" class="laps" aria-label="ラップタイム" hidden></div>
        <div class="earned" aria-label="もらったシール"></div>
        <p id="race-record" class="race-record"></p>
        <div class="goal-buttons">
          <button id="btn-again" class="big-btn again" type="button" aria-label="もういっかい">
            <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M48 32a16 16 0 1 1-6-12.5" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/><path d="M36 10 L50 18 L38 28 Z" fill="#fff" stroke="#fff" stroke-width="4" stroke-linejoin="round"/></svg>
          </button>
          <button id="btn-other" class="big-btn other" type="button" aria-label="ほかの のりもの">
            <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="16" y="18" width="32" height="18" rx="7" fill="#fff"/><rect x="8" y="30" width="48" height="16" rx="7" fill="#fff"/><circle cx="20" cy="48" r="6" fill="#3d2c3e" stroke="#fff" stroke-width="3"/><circle cx="44" cy="48" r="6" fill="#3d2c3e" stroke="#fff" stroke-width="3"/><rect x="21" y="22" width="22" height="9" rx="3" fill="#7ec8ff"/></svg>
          </button>
          <button id="btn-replay" class="big-btn replay" type="button" aria-label="リプレイを みる" hidden>
            <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="8" y="14" width="48" height="36" rx="7" fill="#fff"/><path d="M27 23l14 9-14 9z" fill="#e8344a"/></svg>
          </button>
          <button id="btn-next" class="big-btn next" type="button" aria-label="つぎへ" hidden>
            <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M14 32h30M30 16l16 16-16 16" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
    </section>

    <!-- グランプリ そうごう -->
    <section id="scr-standings" class="screen goal standings" aria-label="そうごう" hidden>
      <div class="goal-card standings-card">
        <h2 class="gp-title">そうごう <small id="standings-round"></small></h2>
        <div id="standings-list" class="standings-list" role="list"></div>
        <div class="goal-buttons">
          <button id="btn-standings-next" class="big-btn next" type="button" aria-label="つぎへ">
            <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M14 32h30M30 16l16 16-16 16" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
    </section>

    <!-- グランプリ ひょうしょうしき -->
    <section id="scr-cup" class="screen goal cup" aria-label="ひょうしょうしき" hidden>
      <div class="goal-card cup-card">
        <h2 class="gp-title" id="cup-text">チャンピオン！</h2>
        <div class="cup-hero">
          <canvas id="cup-canvas" width="260" height="260" aria-hidden="true"></canvas>
          <canvas id="cup-champ" width="240" height="240" aria-hidden="true"></canvas>
        </div>
        <div id="cup-standings" class="standings-list small" role="list"></div>
        <div class="earned" id="cup-earned" aria-label="もらったシール"></div>
        <div class="goal-buttons">
          <button id="btn-cup-home" class="big-btn again" type="button" aria-label="おうちへ">
            <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M10 32 L32 12 L54 32" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 28v22h28V28" fill="#fff"/><rect x="28" y="36" width="8" height="14" fill="#4cc76a"/></svg>
          </button>
        </div>
      </div>
    </section>

    <!-- リプレイ -->
    <section id="scr-replay" class="screen race replay" aria-label="リプレイ" hidden>
      <div class="replay-badge" aria-hidden="true"><i></i>REPLAY</div>
      <div class="replay-bar" aria-hidden="true"><b id="replay-progress"></b></div>
      <button id="btn-replay-cam" class="round-btn cam" type="button" aria-label="カメラを かえる">
        <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="8" y="18" width="38" height="28" rx="6" fill="#fff" stroke="#3d2c3e" stroke-width="4"/><path d="M46 28l12-7v22l-12-7z" fill="#fff" stroke="#3d2c3e" stroke-width="4" stroke-linejoin="round"/><circle cx="20" cy="32" r="5" fill="#ff5a5a"/></svg>
      </button>
      <button id="btn-replay-close" class="round-btn close-x" type="button" aria-label="リプレイを おわる">
        <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M18 18l28 28M46 18L18 46" stroke="#3d2c3e" stroke-width="8" stroke-linecap="round"/></svg>
      </button>
    </section>

    <!-- シールブック -->
    <section id="scr-book" class="screen menu book" aria-label="シールブック" hidden>
      <header class="bar">
        <button class="round-btn back" type="button" data-go="title" aria-label="もどる">
          <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M38 14 L20 32 L38 50" fill="none" stroke="#3d2c3e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </header>
      <div class="book-page"><div class="book-grid" role="list"></div></div>
    </section>
  </main>

  <!-- おうちのかた向け：ながおしで ひらく せってい -->
  <button id="gear" type="button" aria-label="おうちのかたへ：せってい（2びょう ながおし）">
    <svg class="ring" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21" pathLength="100"/></svg>
    <svg class="cog" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-1.7-1L15 3.5h-4l-.4 2.5a7.6 7.6 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7.5 7.5 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.6 7.6 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7.6 7.6 0 0 0 1.7-1l2.4 1 2-3.4zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
  </button>

  <div id="settings" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden>
    <div class="panel">
      <h2 id="settings-title">おうちのかたへ（せってい）</h2>
      <button class="toggle" type="button" data-key="sound" aria-pressed="true"><span>こうかおん（効果音）</span><b aria-hidden="true"></b></button>
      <button class="toggle" type="button" data-key="music" aria-pressed="true"><span>おんがく（BGM）</span><b aria-hidden="true"></b></button>
      <button class="toggle" type="button" data-key="voice" aria-pressed="true"><span>こえ（音声ガイド）</span><b aria-hidden="true"></b></button>
      <button class="toggle" type="button" data-key="tilt" aria-pressed="false"><span>かたむけて ハンドル（傾きセンサー）</span><b aria-hidden="true"></b></button>
      <button class="toggle" type="button" data-key="ghost" aria-pressed="true"><span>おばけ（まえの じぶんと きょうそう）</span><b aria-hidden="true"></b></button>
      <p class="label">スピード</p>
      <div class="speed" role="group" aria-label="スピード">
        <button type="button" data-speed="slow" aria-pressed="true">のんびり</button>
        <button type="button" data-speed="normal" aria-pressed="false">ふつう</button>
      </div>
      <p class="label">きょうそう（ライバルの つよさ）</p>
      <div class="rivals" role="group" aria-label="きょうそう">
        <button type="button" data-rivals="easy" aria-pressed="false">やさしい</button>
        <button type="button" data-rivals="normal" aria-pressed="true">ふつう</button>
        <button type="button" data-rivals="hard" aria-pressed="false">つよい</button>
      </div>
      <p class="note">広告・外部リンク・データ送信はありません。シールの記録はこの端末の中だけに保存されます。</p>
      <div class="row">
        <button id="btn-home" type="button">タイトルへ もどる</button>
        <button id="btn-reset" type="button">シールを ぜんぶ けす</button>
      </div>
      <button id="btn-close" type="button" class="close">とじる</button>
    </div>
  </div>

  <noscript><p class="noscript">このゲームで あそぶには JavaScript を オンにしてください。</p></noscript>
</body>
</html>
